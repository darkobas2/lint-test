# organization-actions/.github/workflows/lint-and-security.yml
#
# Reusable workflow for YAML linting and security scanning
# Uses a GitHub App for auto-commit to maintain audit trail
#

name: Lint + Security

env:
  # Security enforcement - NOT overridable by callers
  CHECKOV_SOFT_FAIL: false
  TRIVY_SOFT_FAIL: false

on:
  workflow_call:
    inputs:
      # === General Settings ===
      auto_fix:
        description: 'Auto-commit lint fixes (requires GitHub App secrets)'
        type: boolean
        default: true
      use_shared_pre_commit:
        type: boolean
        default: true
      use_shared_yamllint:
        type: boolean
        default: true

      # === Checkov Security Scanning ===
      checkov_enabled:
        description: 'Run Checkov security scanning'
        type: boolean
        default: true
      checkov_soft_fail:
        description: 'This input is ignored. Enforcement is configured in the workflow file.'
        type: boolean
        default: false
      checkov_skip_checks:
        description: 'Comma-separated list of Checkov checks to skip'
        type: string
        default: 'CKV_K8S_43,CKV_K8S_40,CKV_K8S_13,CKV_K8S_12,CKV_K8S_11,CKV_K8S_10,CKV_GHA_7'
      checkov_framework:
        description: 'Checkov frameworks to run'
        type: string
        default: 'kubernetes,helm,secrets'
      checkov_upload_sarif:
        description: 'Upload Checkov SARIF to GitHub Code Scanning'
        type: boolean
        default: true

      # === Trivy Security Scanning ===
      trivy_enabled:
        description: 'Run Trivy security scanning'
        type: boolean
        default: true
      trivy_soft_fail:
        description: 'This input is ignored. Enforcement is configured in the workflow file.'
        type: boolean
        default: false
      trivy_skip_dirs:
        description: 'Comma-separated list of directories for Trivy to skip'
        type: string
        default: '.git,.github'
      trivy_upload_sarif:
        description: 'Upload Trivy SARIF to GitHub Code Scanning'
        type: boolean
        default: true

      # === Helm Linting ===
      helm_lint_enabled:
        description: 'Run Helm lint on charts'
        type: boolean
        default: false

      # === CloudFormation Linting ===
      cloudformation_lint_enabled:
        description: 'Run cfn-lint on CloudFormation templates'
        type: boolean
        default: false

      # === Terraform Linting ===
      terraform_lint_enabled:
        description: 'Run Terraform linting (fmt, validate, tflint)'
        type: boolean
        default: false

    secrets:
      LINT_BOT_APP_ID:
        description: 'GitHub App ID for lint-bot'
        required: false
      LINT_BOT_PRIVATE_KEY:
        description: 'GitHub App private key for lint-bot'
        required: false

jobs:
  # 1. Preliminary check job
  check-commit:
    name: Check Commit Status
    runs-on: ubuntu-latest
    outputs:
      is_bot: ${{ steps.check-bot.outputs.is_bot }}
    steps:
      - name: Initial checkout to check commit author
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Check if commit is from lint-bot
        id: check-bot
        run: |
          AUTHOR=$(git log -1 --format='%an')
          MESSAGE=$(git log -1 --format='%s')
          echo "Last commit author: $AUTHOR"
          echo "Last commit message: $MESSAGE"

          if [[ "$AUTHOR" == "lint-bot[bot]" ]] || [[ "$MESSAGE" == "style: auto-fix linting issues" ]]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
            echo "Skipping lint - commit is from lint-bot"
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
            echo "Running lint - commit is from user"
          fi

  lint:
    name: Lint & Format
    needs: check-commit
    # Skip the entire job if the previous job found the bot commit
    if: needs.check-commit.outputs.is_bot != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      fixed: ${{ steps.auto-commit.outputs.has_changes }}
    steps:
      - name: Checkout (with App token for push)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      # Fetch shared configs using GitHub App token for authentication
      - name: Generate GitHub App token
        if: inputs.use_shared_pre_commit == 'true' || inputs.use_shared_yamllint == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LINT_BOT_APP_ID }}
          private-key: ${{ secrets.LINT_BOT_PRIVATE_KEY }}
          owner: darkobas2
          repositories: lint-test

      - name: Fetch shared pre-commit config
        if: inputs.use_shared_pre_commit == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Fetching pre-commit config from organization-actions"
          gh api /repos/darkobas2/lint-test/contents/pre-commit/base.yaml \
            --jq '.content' | base64 -d > .pre-commit-config.yaml

      - name: Fetch shared yamllint config
        if: inputs.use_shared_yamllint == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Fetching yamllint config from organization-actions"
          gh api /repos/darkobas2/lint-test/contents/pre-commit/.yamllint \
            --jq '.content' | base64 -d > .yamllint

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        id: pre-commit
        run: |
          pre-commit run --all-files 2>&1 | tee pre-commit-output.txt || echo "pre_commit_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      # Auto-commit using reusable action
      - name: Auto-commit linting fixes
        id: auto-commit
        uses: darkobas2/lint-test/.github/actions/auto-commit@main
        with:
          commit_message: 'style: auto-fix linting issues'
          app_id: ${{ secrets.LINT_BOT_APP_ID }}
          private_key: ${{ secrets.LINT_BOT_PRIVATE_KEY }}
          auto_fix_enabled: ${{ inputs.auto_fix }}
          pr_user_login: ${{ github.event.pull_request.user.login }}
          pr_user_id: ${{ github.event.pull_request.user.id }}
          exclude_paths: '.github/workflows/'

      # Fail if pre-commit failed and no auto-fix
      - name: Fail if issues remain
        if: steps.pre-commit.outputs.pre_commit_failed == 'true' && (!inputs.auto_fix || steps.auto-commit.outputs.committed != 'true')
        run: |
          echo "::error::Pre-commit found issues. See PR comment for fix instructions."
          exit 1

  helm-lint:
    name: Helm Lint
    if: inputs.helm_lint_enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Find Helm charts
        id: find-charts
        run: |
          charts=()

          # Check if Chart.yaml exists in root
          if [[ -f "Chart.yaml" ]]; then
            echo "Found chart in root directory"
            charts+=(".")
          fi

          # Find charts in subdirectories
          while IFS= read -r chart; do
            chart_dir=$(dirname "$chart")
            echo "Found chart in $chart_dir"
            charts+=("$chart_dir")
          done < <(find . -mindepth 2 -name "Chart.yaml" -not -path "*/\.*")

          if [[ ${#charts[@]} -eq 0 ]]; then
            echo "No Helm charts found"
            echo "charts_found=false" >> $GITHUB_OUTPUT
          else
            echo "charts_found=true" >> $GITHUB_OUTPUT
            # Join array with newlines
            printf "%s\n" "${charts[@]}" > charts.txt
          fi

      - name: Lint Helm charts
        if: steps.find-charts.outputs.charts_found == 'true'
        run: |
          failed=0
          while IFS= read -r chart; do
            echo "::group::Linting $chart"
            if helm lint "$chart"; then
              echo "✓ $chart passed"
            else
              echo "✗ $chart failed"
              failed=1
            fi
            echo "::endgroup::"
          done < charts.txt

          if [[ $failed -eq 1 ]]; then
            echo "::error::One or more Helm charts failed linting"
            exit 1
          fi

  cloudformation-lint:
    name: CloudFormation Lint
    if: inputs.cloudformation_lint_enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Find CloudFormation templates
        id: find-templates
        run: |
          templates=()

          # Find YAML/JSON files that look like CloudFormation templates
          # Check for common CF keywords in files
          while IFS= read -r file; do
            if grep -qE '(AWSTemplateFormatVersion|Resources:)' "$file" 2>/dev/null; then
              echo "Found CloudFormation template: $file"
              templates+=("$file")
            fi
          done < <(find . -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) -not -path "*/\.*" -not -path "*/node_modules/*" -not -path "*/vendor/*")

          if [[ ${#templates[@]} -eq 0 ]]; then
            echo "No CloudFormation templates found"
            echo "templates_found=false" >> $GITHUB_OUTPUT
          else
            echo "templates_found=true" >> $GITHUB_OUTPUT
            # Join array with newlines
            printf "%s\n" "${templates[@]}" > cf-templates.txt
          fi

      - name: Lint CloudFormation templates
        if: steps.find-templates.outputs.templates_found == 'true'
        run: |
          failed=0
          while IFS= read -r template; do
            echo "::group::Linting $template"
            if cfn-lint "$template"; then
              echo "✓ $template passed"
            else
              echo "✗ $template failed"
              failed=1
            fi
            echo "::endgroup::"
          done < cf-templates.txt

          if [[ $failed -eq 1 ]]; then
            echo "::error::One or more CloudFormation templates failed linting"
            exit 1
          fi

  terraform-lint:
    name: Terraform Lint
    if: inputs.terraform_lint_enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Find Terraform directories
        id: find-dirs
        run: |
          dirs=()

          # Find directories containing .tf files
          while IFS= read -r tf_file; do
            dir=$(dirname "$tf_file")
            # Add unique directories only
            if [[ ! " ${dirs[@]} " =~ " ${dir} " ]]; then
              echo "Found Terraform directory: $dir"
              dirs+=("$dir")
            fi
          done < <(find . -type f -name "*.tf" -not -path "*/\.*" -not -path "*/.terraform/*")

          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "No Terraform directories found"
            echo "dirs_found=false" >> $GITHUB_OUTPUT
          else
            echo "dirs_found=true" >> $GITHUB_OUTPUT
            # Join array with newlines
            printf "%s\n" "${dirs[@]}" > tf-dirs.txt
          fi

      - name: Run Terraform Format
        if: steps.find-dirs.outputs.dirs_found == 'true'
        run: |
          while IFS= read -r dir; do
            echo "::group::Formatting $dir"
            terraform -chdir="$dir" fmt -recursive
            echo "✓ $dir formatted"
            echo "::endgroup::"
          done < tf-dirs.txt

      # Auto-commit using reusable action
      - name: Auto-commit Terraform formatting
        if: steps.find-dirs.outputs.dirs_found == 'true'
        uses: darkobas2/lint-test/.github/actions/auto-commit@main
        with:
          commit_message: 'style: auto-fix Terraform formatting'
          app_id: ${{ secrets.LINT_BOT_APP_ID }}
          private_key: ${{ secrets.LINT_BOT_PRIVATE_KEY }}
          auto_fix_enabled: ${{ inputs.auto_fix }}
          pr_user_login: ${{ github.event.pull_request.user.login }}
          pr_user_id: ${{ github.event.pull_request.user.id }}

      - name: Terraform Init & Validate
        if: steps.find-dirs.outputs.dirs_found == 'true'
        run: |
          failed=0
          while IFS= read -r dir; do
            echo "::group::Validating $dir"
            if terraform -chdir="$dir" init -backend=false && terraform -chdir="$dir" validate; then
              echo "✓ $dir validation passed"
            else
              echo "✗ $dir validation failed"
              failed=1
            fi
            echo "::endgroup::"
          done < tf-dirs.txt

          if [[ $failed -eq 1 ]]; then
            echo "::error::Terraform validation failed"
            exit 1
          fi

      - name: Run TFLint
        if: steps.find-dirs.outputs.dirs_found == 'true'
        run: |
          # Get absolute path to config file
          CONFIG_FILE="$(pwd)/.tflint.hcl"
          CONFIG_ARG=""
          if [[ -f "$CONFIG_FILE" ]]; then
            CONFIG_ARG="--config $CONFIG_FILE"
          fi

          failed=0
          while IFS= read -r dir; do
            echo "::group::Running TFLint on $dir"
            if tflint --chdir="$dir" --init $CONFIG_ARG && tflint --chdir="$dir" $CONFIG_ARG; then
              echo "✓ $dir TFLint passed"
            else
              echo "✗ $dir TFLint failed"
              failed=1
            fi
            echo "::endgroup::"
          done < tf-dirs.txt

          if [[ $failed -eq 1 ]]; then
            echo "::error::TFLint found issues"
            exit 1
          fi

  security:
    name: Security Scan
    if: inputs.checkov_enabled || inputs.trivy_enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **.yaml
            **.yml
            charts/**
            Chart.yaml

      - name: Run Checkov
        if: inputs.checkov_enabled && steps.changed-files.outputs.any_changed == 'true'
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: ${{ inputs.checkov_framework }}
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          compact: true
          quiet: false
          skip_check: ${{ inputs.checkov_skip_checks }}
        continue-on-error: true

      # Debug Checkov SARIF
      - name: Debug Checkov SARIF
        if: always() && inputs.checkov_enabled && steps.checkov.outcome != 'skipped'
        run: |
          echo "Checkov outcome: ${{ steps.checkov.outcome }}"
          if [[ -f "checkov-results.sarif" ]]; then
            echo "✓ checkov-results.sarif exists"
            echo "File size: $(stat -f%z checkov-results.sarif 2>/dev/null || stat -c%s checkov-results.sarif) bytes"
            echo "First 100 lines:"
            head -100 checkov-results.sarif || true
          else
            echo "✗ checkov-results.sarif NOT found"
          fi

      # Upload Checkov SARIF
      - name: Upload Checkov SARIF
        if: always() && inputs.checkov_enabled && inputs.checkov_upload_sarif && steps.checkov.outcome != 'skipped' && hashFiles('checkov-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif
          category: Checkov
        continue-on-error: false

      # Check Checkov results and set output
      - name: Check Checkov SARIF for issues
        if: inputs.checkov_enabled
        id: checkov-check
        run: |
          if [[ -f "checkov-results.sarif" ]]; then
            # Use Python to properly parse SARIF JSON
            HAS_ISSUES=$(python3 -c "
          import json, sys
          with open('checkov-results.sarif') as f:
              sarif = json.load(f)
              for run in sarif.get('runs', []):
                  if len(run.get('results', [])) > 0:
                      print('true')
                      sys.exit(0)
              print('false')
          ")
            echo "has_issues=$HAS_ISSUES" >> $GITHUB_OUTPUT
            if [[ "$HAS_ISSUES" == "true" ]]; then
              echo "Checkov found security issues"
            else
              echo "Checkov found no issues"
            fi
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      # Run Trivy scan (always succeeds to ensure SARIF upload for code scanning)
      - name: Run Trivy vulnerability scanner
        if: inputs.trivy_enabled && steps.changed-files.outputs.any_changed == 'true'
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: ${{ inputs.trivy_skip_dirs }}
          scanners: 'vuln,secret,config'
          exit-code: '0'
        continue-on-error: false

      # Debug Trivy SARIF
      - name: Debug Trivy SARIF
        if: always() && inputs.trivy_enabled && steps.trivy.outcome != 'skipped'
        run: |
          echo "Trivy outcome: ${{ steps.trivy.outcome }}"
          if [[ -f "trivy-results.sarif" ]]; then
            echo "✓ trivy-results.sarif exists"
            echo "File size: $(stat -c%s trivy-results.sarif) bytes"
          else
            echo "✗ trivy-results.sarif NOT found"
          fi

      # Upload Trivy SARIF
      - name: Upload Trivy SARIF
        if: always() && inputs.trivy_enabled && inputs.trivy_upload_sarif && steps.trivy.outcome != 'skipped' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: Trivy
        continue-on-error: false

      # Check Trivy results and set output
      - name: Check Trivy SARIF for issues
        if: inputs.trivy_enabled
        id: trivy-check
        run: |
          if [[ -f "trivy-results.sarif" ]]; then
            # Use Python to properly parse SARIF JSON
            HAS_ISSUES=$(python3 -c "
          import json, sys
          with open('trivy-results.sarif') as f:
              sarif = json.load(f)
              for run in sarif.get('runs', []):
                  if len(run.get('results', [])) > 0:
                      print('true')
                      sys.exit(0)
              print('false')
          ")
            echo "has_issues=$HAS_ISSUES" >> $GITHUB_OUTPUT
            if [[ "$HAS_ISSUES" == "true" ]]; then
              echo "Trivy found security issues"
            else
              echo "Trivy found no issues"
            fi
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment security scan results
        if: always() && (inputs.checkov_enabled || inputs.trivy_enabled) && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const checkovEnabled = ${{ inputs.checkov_enabled }};
            const trivyEnabled = ${{ inputs.trivy_enabled }};
            const checkovHasIssues = '${{ steps.checkov-check.outputs.has_issues }}';
            const checkovSoftFail = '${{ env.CHECKOV_SOFT_FAIL }}' === 'true';
            const trivySoftFail = '${{ env.TRIVY_SOFT_FAIL }}' === 'true';

            let body = '## 🔒 Security Scan Results\n\n';
            let hasFindings = false;

            // Checkov results
            if (checkovEnabled && checkovHasIssues !== '') {
              body += '### Checkov\n';
              if (checkovHasIssues === 'false') {
                body += '✅ No issues found\n\n';
              } else if (checkovHasIssues === 'true') {
                body += checkovSoftFail
                  ? '⚠️ Issues found (soft-fail mode)\n\n'
                  : '❌ Issues found - must be fixed\n\n';
                hasFindings = true;
              }
            }

            // Trivy results
            const trivyHasIssues = '${{ steps.trivy-check.outputs.has_issues }}';
            if (trivyEnabled && trivyHasIssues !== '') {
              body += '### Trivy\n';
              if (trivyHasIssues === 'false') {
                body += '✅ No issues found\n\n';
              } else if (trivyHasIssues === 'true') {
                body += trivySoftFail
                  ? '⚠️ Issues found (soft-fail mode)\n\n'
                  : '❌ Issues found - must be fixed\n\n';
                hasFindings = true;
              }
            }

            // Links to results
            body += '---\n\n';
            body += '📊 **View detailed results:**\n';
            if (context.payload.pull_request) {
              body += `- [Issues in this PR](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning?query=is:open+pr:${context.payload.pull_request.number})\n`;
              body += `- [All Code Scanning Alerts](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning)\n\n`;
            } else {
              body += `- [Code Scanning Alerts](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning)\n\n`;
            }

            // Local testing instructions
            if (hasFindings) {
              body += '<details><summary>🔧 Run scans locally</summary>\n\n';
              if (checkovEnabled) {
                body += '**Checkov:**\n```bash\npip install checkov\n';
                body += 'checkov -d . --framework ${{ inputs.checkov_framework }}\n```\n\n';
              }
              if (trivyEnabled) {
                body += '**Trivy:**\n```bash\n';
                body += 'trivy fs --severity CRITICAL,HIGH,MEDIUM .\n```\n';
              }
              body += '</details>';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if security issues found
        if: |
          (steps.checkov-check.outputs.has_issues == 'true' && env.CHECKOV_SOFT_FAIL == 'false') ||
          (steps.trivy-check.outputs.has_issues == 'true' && env.TRIVY_SOFT_FAIL == 'false')
        run: |
          echo "::error::Security scan failed - issues must be fixed before merging"
          if [[ "${{ steps.checkov-check.outputs.has_issues }}" == "true" && "${{ env.CHECKOV_SOFT_FAIL }}" == "false" ]]; then
            echo "  - Checkov found security issues"
          fi
          if [[ "${{ steps.trivy-check.outputs.has_issues }}" == "true" && "${{ env.TRIVY_SOFT_FAIL }}" == "false" ]]; then
            echo "  - Trivy found vulnerabilities or misconfigurations"
          fi
          exit 1
